<mat-sidenav-container class="layout-container">
    <mat-sidenav #drawer mode="over" [opened]="false" [autoFocus]="false" class="sidebar">
        <div class="sidebar-header">
            <div class="company-brand">
                <div class="company-logo-container">
                    <img [src]="CompaniaActual?.LogoUrl || 'assets/img/logo-sf.jpeg'" alt="Logo empresa"
                        class="company-logo">
                </div>

                <div class="company-brand-info">
                    <strong>{{CompaniaActual?.Nombre || 'Mi Empresa'}}</strong>
                    <span>Panel administrativo</span>
                </div>
            </div>

            <button mat-icon-button class="sidebar-close" type="button" (click)="drawer.close()">
                <mat-icon>close</mat-icon>
            </button>
        </div>

        <div class="menu-content">
            <div class="menu-section-title">
                <span>MENÚ PRINCIPAL</span>
            </div>

            <mat-nav-list class="main-menu">
                <a mat-list-item class="menu-item" routerLinkActive="active-item"
                    [routerLinkActiveOptions]="{exact: true}" (click)="navigateTo(menuItems[0].route)">
                    <div class="menu-item-content">
                        <div class="menu-icon-container">
                            <mat-icon>{{menuItems[0].icon}}</mat-icon>
                        </div>

                        <span class="menu-label">{{menuItems[0].label}}</span>
                    </div>
                </a>
            </mat-nav-list>

            <mat-accordion displayMode="flat" multi class="menu-accordion">
                <mat-expansion-panel *ngFor="let item of menuItems.slice(1)" class="menu-panel" hideToggle>
                    <mat-expansion-panel-header class="menu-header">
                        <mat-panel-title>
                            <div class="menu-item-content">
                                <div class="menu-icon-container">
                                    <mat-icon>{{item.icon}}</mat-icon>
                                </div>

                                <span class="menu-label">{{item.label}}</span>
                            </div>
                        </mat-panel-title>

                        <mat-icon class="expand-icon">keyboard_arrow_down</mat-icon>
                    </mat-expansion-panel-header>

                    <ng-container *ngIf="item.children?.length; else itemSinHijos">
                        <mat-nav-list class="submenu-list">
                            <a mat-list-item *ngFor="let child of item.children" class="submenu-item"
                                routerLinkActive="submenu-active" (click)="navigateTo(child.route)">
                                <div class="submenu-content">
                                    <span class="submenu-line"></span>

                                    <div class="submenu-icon-container">
                                        <mat-icon>{{child.icon}}</mat-icon>
                                    </div>

                                    <span class="submenu-label">{{child.label}}</span>
                                </div>
                            </a>
                        </mat-nav-list>
                    </ng-container>

                    <ng-template #itemSinHijos>
                        <mat-nav-list class="submenu-list">
                            <a mat-list-item class="submenu-item" routerLinkActive="submenu-active"
                                (click)="navigateTo(item.route)">
                                <div class="submenu-content">
                                    <span class="submenu-line"></span>

                                    <div class="submenu-icon-container">
                                        <mat-icon>{{item.icon}}</mat-icon>
                                    </div>

                                    <span class="submenu-label">{{item.label}}</span>
                                </div>
                            </a>
                        </mat-nav-list>
                    </ng-template>
                </mat-expansion-panel>
            </mat-accordion>
        </div>

        <div class="sidebar-footer">
            <button mat-button [matMenuTriggerFor]="sidebarUserMenu" class="sidebar-user-button">
                <img [src]="UsuarioActual?.Foto || 'assets/icons/user.svg'" alt="Usuario" class="user-avatar">

                <div class="user-info">
                    <strong>{{UsuarioActual?.NombreCompleto}}</strong>
                    <span>{{RolActual?.Nombre}}</span>
                </div>

                <mat-icon class="user-options">more_vert</mat-icon>
            </button>

            <mat-menu #sidebarUserMenu="matMenu">
                <button mat-menu-item (click)="irAPerfil()">
                    <mat-icon>person_outline</mat-icon>
                    <span>Mi perfil</span>
                </button>

                <button mat-menu-item (click)="OnClickLogout()">
                    <mat-icon>logout</mat-icon>
                    <span>Cerrar sesión</span>
                </button>
            </mat-menu>
        </div>
    </mat-sidenav>

    <mat-sidenav-content class="main-content">
        <mat-toolbar class="topbar">
            <div class="topbar-left">
                <button mat-icon-button class="menu-button" type="button" (click)="drawer.toggle()">
                    <mat-icon>menu</mat-icon>
                </button>

                <div class="topbar-company">
                    <!-- <span class="topbar-page-label">Administración</span> -->

                    <div class="topbar-title">
                        <strong>{{CompaniaActual?.Nombre}}</strong>

                        <span class="topbar-divider"></span>

                        <span>{{SucursalActual?.Nombre}}</span>
                    </div>
                </div>
            </div>

            <div class="topbar-actions">
                <div class="topbar-actions">

                    <button mat-icon-button class="tsopbar-icon-button" type="button" matTooltip="Alertas de inventario"
                        (click)="abrirNotificacionesStock()">
                        <mat-icon>notifications_none</mat-icon>
                        <span class="notification-dot"></span>
                    </button>

                    <button mat-button [matMenuTriggerFor]="userMenu" class="user-toolbar-btn">
                        <div class="toolbar-user-info">
                            <strong>{{UsuarioActual?.NombreCompleto}}</strong>
                        </div>

                        <mat-icon class="toolbar-expand-icon">keyboard_arrow_down</mat-icon>
                    </button>

                </div>
                <mat-menu #userMenu="matMenu">
                    <button mat-menu-item (click)="irAPerfil()">
                        <mat-icon>person_outline</mat-icon>
                        <span>Mi perfil</span>
                    </button>

                    <button mat-menu-item (click)="OnClickLogout()">
                        <mat-icon>logout</mat-icon>
                        <span>Cerrar sesión</span>
                    </button>
                </mat-menu>
            </div>
        </mat-toolbar>

        <main class="content-wrapper">
            <ng-content select="[Body]"></ng-content>
        </main>
    </mat-sidenav-content>
</mat-sidenav-container>
