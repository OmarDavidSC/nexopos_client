<!-- administracion-tipo-incidencias.component.html -->

<div class="contenedor-admin">
    <!-- HEADER -->
    <app-adm-header [descripcion]="'Gestión y mantenimiento de usuarios registrados en tu compañia'"
        [breadcrumbs]="[{nombre:'Mi Empresa'},{nombre:'Mis Usuarios'}]" [visible]="true" [textoBoton]="'Nuevo Usuario'"
        (accionNuevo)="eventoMostrarPopupRegistrar()" [rutaRegreso]="'/inicio'">
    </app-adm-header>
    <!-- TABLA -->
    <div class="table-container">
        <!-- LOADING -->
        <div *ngIf="Loading" class="loading-overlay">
            <div class="loading-box">
                <mat-spinner diameter="42"></mat-spinner>
                <span>
                    Cargando usuarios...
                </span>
            </div>
        </div>
        <!-- TABLA -->
        <div class="table-responsive">
            <table mat-table [dataSource]="ListaUsuarios" class="tabla-admin">
                <!-- NOMBRE -->
                <ng-container matColumnDef="Nombre">
                    <th mat-header-cell *matHeaderCellDef> Nombre </th>
                    <td mat-cell *matCellDef="let element">
                        <div class="nombre-box">
                            <div>
                                <div class="nombre-principal">
                                    {{element.Nombre}}
                                </div>
                            </div>
                        </div>
                    </td>
                </ng-container>
                <ng-container matColumnDef="ApellidoPaterno">
                    <th mat-header-cell *matHeaderCellDef> Apellido Parterno </th>
                    <td mat-cell *matCellDef="let element">
                        <div class="nombre-box">
                            <div>
                                <div class="nombre-principal">
                                    {{element.ApellidoPaterno}}
                                </div>
                            </div>
                        </div>
                    </td>
                </ng-container>
                <ng-container matColumnDef="ApellidoMaterno">
                    <th mat-header-cell *matHeaderCellDef> Apellido Materno </th>
                    <td mat-cell *matCellDef="let element">
                        <div class="nombre-box">
                            <div>
                                <div class="nombre-principal">
                                    {{element.ApellidoMaterno}}
                                </div>
                            </div>
                        </div>
                    </td>
                </ng-container>
                <ng-container matColumnDef="Usuario">
                    <th mat-header-cell *matHeaderCellDef> Usuario </th>
                    <td mat-cell *matCellDef="let element">
                        <div class="nombre-box">
                            <div>
                                <div class="nombre-principal">
                                    {{element.Usuario}}
                                </div>
                            </div>
                        </div>
                    </td>
                </ng-container>
                <ng-container matColumnDef="Email">
                    <th mat-header-cell *matHeaderCellDef> Correo </th>
                    <td mat-cell *matCellDef="let element">
                        <div class="nombre-box">
                            <div>
                                <div class="nombre-principal">
                                    {{element.Email}}
                                </div>
                            </div>
                        </div>
                    </td>
                </ng-container>
                <ng-container matColumnDef="Sucursal">
                    <th mat-header-cell *matHeaderCellDef> Sucursal </th>
                    <td mat-cell *matCellDef="let element">
                        <div class="nombre-box">
                            <div>
                                <div class="nombre-principal">
                                    {{element.NombreSucursal}}
                                </div>
                            </div>
                        </div>
                    </td>
                </ng-container>
                <ng-container matColumnDef="Rol">
                    <th mat-header-cell *matHeaderCellDef> Rol </th>
                    <td mat-cell *matCellDef="let element">
                        <div class="nombre-box">
                            <div>
                                <div class="nombre-principal">
                                    {{element.NombreRol}}
                                </div>
                            </div>
                        </div>
                    </td>
                </ng-container>

                <!-- ACCIONES -->
                <ng-container matColumnDef="Acciones">
                    <th mat-header-cell *matHeaderCellDef>
                        Acciones
                    </th>
                    <td mat-cell *matCellDef="let element">
                        <div class="acciones-box">
                            <button (click)="eventoMostrarPopupEditar(element)" mat-icon-button
                                class="btn-accion btn-editar" matTooltip="Editar">
                                <mat-icon>edit</mat-icon>
                            </button>
                            <button (click)="eventoEliminar(element)" mat-icon-button class="btn-accion btn-eliminar"
                                matTooltip="Eliminar">
                                <mat-icon>delete</mat-icon>
                            </button>
                        </div>
                    </td>
                </ng-container>
                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="fila-tabla">
                </tr>
            </table>
        </div>
        <!-- PAGINADOR -->
        <app-adm-paginator [PaginaActual]="PaginaActual" [TotalPaginas]="TotalPaginas"
            (cambiarPaginaEvent)="OnchangedPage($event)">
        </app-adm-paginator>
    </div>
</div>
