<!-- administracion-tipo-incidencias.component.html -->

<div class="contenedor-admin">
    <!-- HEADER -->
    <app-adm-header [descripcion]="'Gestión y mantenimiento de clientes registrados'"
        [breadcrumbs]="[{nombre:'Ventas'},{nombre:'Administración de Clientes'}]" [visible]="true"
        [textoBoton]="'Nuevo Cliente'" (accionNuevo)="eventoMostrarPopupRegistrar()" [rutaRegreso]="'/inicio'">
    </app-adm-header>
    <!-- TABLA -->
    <div class="table-container">
        <!-- LOADING -->
        <div *ngIf="Loading" class="loading-overlay">
            <div class="loading-box">
                <mat-spinner diameter="42"></mat-spinner>
                <span>
                    Cargando clientes...
                </span>
            </div>
        </div>
        <!-- TABLA -->
        <div class="table-responsive">
            <table mat-table [dataSource]="ListaClientes" class="tabla-admin">
                <ng-container matColumnDef="TipoDocumento">
                    <th mat-header-cell *matHeaderCellDef> Tipo Documento </th>
                    <td mat-cell *matCellDef="let element">
                        <div class="nombre-box">
                            <div>
                                <div class="nombre-principal">
                                    {{element.TipoDocumento}}
                                </div>
                            </div>
                        </div>
                    </td>
                </ng-container>
                <ng-container matColumnDef="NumeroDocumento">
                    <th mat-header-cell *matHeaderCellDef> Numero Documento </th>
                    <td mat-cell *matCellDef="let element">
                        <div class="nombre-box">
                            <div>
                                <div class="nombre-principal">
                                    {{element.NumeroDocumento}}
                                </div>
                            </div>
                        </div>
                    </td>
                </ng-container>
                <ng-container matColumnDef="Nombre">
                    <th mat-header-cell *matHeaderCellDef> Nombre</th>
                    <td mat-cell *matCellDef="let element">
                        <div class="nombre-box">
                            <div>
                                <div class="nombre-principal">
                                    {{element.Nombre}}
                                </div>
                            </div>
                        </div>
                    </td>
                </ng-container>
                <ng-container matColumnDef="Telefono">
                    <th mat-header-cell *matHeaderCellDef> Telefono</th>
                    <td mat-cell *matCellDef="let element">
                        <div class="nombre-box">
                            <div>
                                <div class="nombre-principal">
                                    {{element.Telefono}}
                                </div>
                            </div>
                        </div>
                    </td>
                </ng-container>
                <ng-container matColumnDef="Correo">
                    <th mat-header-cell *matHeaderCellDef> Correo</th>
                    <td mat-cell *matCellDef="let element">
                        <div class="nombre-box">
                            <div>
                                <div class="nombre-principal">
                                    {{element.Correo}}
                                </div>
                            </div>
                        </div>
                    </td>
                </ng-container>
                <ng-container matColumnDef="Direccion">
                    <th mat-header-cell *matHeaderCellDef> Direccion</th>
                    <td mat-cell *matCellDef="let element">
                        <div class="nombre-box">
                            <div>
                                <div class="nombre-principal">
                                    {{element.Direccion}}
                                </div>
                            </div>
                        </div>
                    </td>
                </ng-container>
                <!-- ACCIONES -->
                <ng-container matColumnDef="Acciones">
                    <th mat-header-cell *matHeaderCellDef>
                        Acciones
                    </th>
                    <td mat-cell *matCellDef="let element">
                        <div class="acciones-box">
                            <button (click)="eventoMostrarPopupEditar(element)" mat-icon-button
                                class="btn-accion btn-editar" matTooltip="Editar">
                                <mat-icon>edit</mat-icon>
                            </button>
                            <button *ngIf="tienePermiso(Role, ['administrator'])" (click)="eventoEliminar(element)" mat-icon-button class="btn-accion btn-eliminar"
                                matTooltip="Eliminar">
                                <mat-icon>delete</mat-icon>
                            </button>
                        </div>
                    </td>
                </ng-container>
                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="fila-tabla">
                </tr>
            </table>
        </div>
        <!-- PAGINADOR -->
        <app-adm-paginator [PaginaActual]="PaginaActual" [TotalPaginas]="TotalPaginas"
            (cambiarPaginaEvent)="OnchangedPage($event)">
        </app-adm-paginator>
    </div>
</div>
