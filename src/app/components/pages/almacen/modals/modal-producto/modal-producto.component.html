<!-- HEADER -->
<div class="popup-header">
    <div class="header-icon">
        <mat-icon>inventory_2</mat-icon>
    </div>
    <div>
        <h2 mat-dialog-title class="titulo-popup">
            {{TituloPopup}}
        </h2>
        <p class="subtitulo-popup">
            Complete la información del producto
        </p>
    </div>
</div>

<!-- CONTENT -->
<div mat-dialog-content class="popup-content">
    <form *ngIf="Form" [formGroup]="Form" class="formulario-producto">
        <!-- general -->
        <div class="section-form">
            <div class="section-title">
                Información General
            </div>
            <div class="row g-3">
                <div class="col-md-6">
                    <mat-form-field appearance="outline" class="w-100">
                        <mat-label>Categoría</mat-label>
                        <mat-select formControlName="category_id">
                            <mat-option *ngFor="let item of ListaCategorias" [value]="item.Id">
                                {{item.Nombre}}
                            </mat-option>
                        </mat-select>
                        <mat-error>
                            <app-error-validation-display [FormControl]="Form.get('category_id')">
                            </app-error-validation-display>
                        </mat-error>
                    </mat-form-field>
                </div>
                <div class="col-md-6">
                    <mat-form-field appearance="outline" class="w-100">
                        <mat-label>Marca</mat-label>
                        <mat-select formControlName="brand_id">
                            <mat-option *ngFor="let item of ListaMarcas" [value]="item.Id">
                                {{item.Nombre}}
                            </mat-option>
                        </mat-select>
                        <mat-error>
                            <app-error-validation-display [FormControl]="Form.get('brand_id')">
                            </app-error-validation-display>
                        </mat-error>
                    </mat-form-field>
                </div>
                <div class="col-md-6">
                    <mat-form-field appearance="outline" class="w-100">
                        <mat-label>Unidad</mat-label>
                        <mat-select formControlName="unit_id">
                            <mat-option *ngFor="let item of ListaUnidades" [value]="item.Id">
                                {{item.Nombre}}
                            </mat-option>
                        </mat-select>
                    </mat-form-field>
                </div>
                <div class="col-md-6">
                    <mat-form-field appearance="outline" class="w-100">
                        <mat-label>Código</mat-label>
                        <input matInput formControlName="code">
                    </mat-form-field>
                </div>
                <div class="col-md-12">
                    <mat-form-field appearance="outline" class="w-100">
                        <mat-label>Nombre del producto</mat-label>
                        <input matInput formControlName="name">
                        <mat-error>
                            <app-error-validation-display [FormControl]="Form.get('name')">
                            </app-error-validation-display>
                        </mat-error>
                    </mat-form-field>
                </div>
            </div>
        </div>
        <!-- ================= PRECIOS ================= -->
        <div class="section-form">
            <div class="section-title">
                Información Comercial
            </div>
            <div class="row g-3">
                <div class="col-md-6">
                    <mat-form-field appearance="outline" class="w-100">
                        <mat-label>Precio Compra</mat-label>
                        <input matInput type="number" min="0" step="0.01" formControlName="purchase_price">
                    </mat-form-field>
                </div>
                <div class="col-md-6">
                    <mat-form-field appearance="outline" class="w-100">
                        <mat-label>Precio Venta</mat-label>
                        <input matInput type="number" min="0" step="0.01" formControlName="sale_price">
                    </mat-form-field>
                </div>
            </div>
        </div>
    </form>
</div>
<!-- FOOTER -->

<div mat-dialog-actions class="popup-actions">
    <button mat-stroked-button class="btn-cancelar" (click)="dialogRef.close()">
        Cancelar
    </button>
    <button mat-raised-button class="btn-guardar" (click)="eventoGuardar()">
        <mat-icon>
            save
        </mat-icon>
        {{TituloButton}}
    </button>
</div>
