<section class="card border-0 shadow-sm profit-filter-card">
    <div class="card-body p-3">
        <div class="row g-2 align-items-end">
            <div class="col-12 col-md-6 col-lg-3">
                <mat-form-field appearance="outline" class="w-100 compact-field">
                    <mat-label>Sucursal</mat-label>
                    <mat-select [(ngModel)]="FiltroLocal.branch_id" [disabled]="loading">
                        <mat-option [value]="null">Todas las sucursales</mat-option>
                        <mat-option *ngFor="let sucursal of sucursales" [value]="sucursal.Id">
                            {{ sucursal.Nombre }}
                        </mat-option>
                    </mat-select>
                    <mat-icon matSuffix>store</mat-icon>
                </mat-form-field>
            </div>
            <div class="col-12 col-md-6 col-lg-2">
                <mat-form-field appearance="outline" class="w-100 compact-field">
                    <mat-label>Fecha inicio</mat-label>
                    <input matInput [matDatepicker]="pickerStart" [(ngModel)]="FechaInicio" [max]="FechaFin"
                        [disabled]="loading" placeholder="Fecha inicio" readonly>
                    <mat-datepicker-toggle matSuffix [for]="pickerStart"></mat-datepicker-toggle>
                    <mat-datepicker #pickerStart></mat-datepicker>
                </mat-form-field>
            </div>
            <div class="col-12 col-md-6 col-lg-2">
                <mat-form-field appearance="outline" class="w-100 compact-field">
                    <mat-label>Fecha fin</mat-label>
                    <input matInput [matDatepicker]="pickerEnd" [(ngModel)]="FechaFin" [min]="FechaInicio"
                        [disabled]="loading" placeholder="Fecha fin" readonly>
                    <mat-datepicker-toggle matSuffix [for]="pickerEnd"></mat-datepicker-toggle>
                    <mat-datepicker #pickerEnd></mat-datepicker>
                </mat-form-field>
            </div>
            <div class="col-12 col-md-6 col-lg-5">
                <div class="d-flex flex-column flex-sm-row justify-content-lg-end gap-2">
                    <button mat-stroked-button type="button" class="btn-action" [disabled]="loading"
                        (click)="onLimpiar()">
                        <mat-icon>restart_alt</mat-icon>
                        Limpiar
                    </button>
                    <button mat-flat-button color="primary" type="button" class="btn-action"
                        [disabled]="loading || !fechasValidas" (click)="onBuscar()">
                        <mat-icon>search</mat-icon>
                        Buscar
                    </button>
                </div>
            </div>
        </div>
        <div class="alert alert-danger py-2 px-3 mt-2 mb-0 d-flex align-items-center gap-2" *ngIf="!fechasValidas">
            <mat-icon>warning</mat-icon>
            <span>La fecha inicial no puede ser mayor que la fecha final.</span>
        </div>
    </div>
</section>
