<div class="card reporte-card">
    <div class="card-header">
        <div class="titulo">
            <mat-icon> receipt_long </mat-icon>

            Tipos de voucher
        </div>
    </div>

    <div class="card-body">
        <div class="row" *ngIf="Datos && Datos.length">
            <div class="col-md-6 mb-3" *ngFor="let item of Datos">
                <div class="voucher-card">
                    <div class="voucher-icon">
                        <mat-icon> receipt </mat-icon>
                    </div>

                    <div class="voucher-info">
                        <h4>
                            {{ item.voucher_type }}
                        </h4>

                        <div class="detalle">
                            <span> Compras: </span>

                            <strong>
                                {{ item.total_purchases }}
                            </strong>
                        </div>

                        <div class="detalle">
                            <span> Total: </span>

                            <strong>
                                S/
                                {{ item.total_amount | number: "1.2-2" }}
                            </strong>
                        </div>

                        <div class="detalle">
                            <span> Promedio: </span>

                            <strong>
                                S/
                                {{ item.average_ticket | number: "1.2-2" }}
                            </strong>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="empty" *ngIf="!Datos || Datos.length === 0">
            No hay información disponible
        </div>
    </div>
</div>
