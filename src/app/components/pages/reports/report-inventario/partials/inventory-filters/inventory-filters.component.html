<section class="compact-filter">
    <div class="filter-heading">
        <div class="filter-icon">
            <mat-icon>filter_alt</mat-icon>
        </div>

        <div class="filter-title">
            <strong>Filtros</strong>
            <span>Inventario</span>
        </div>
    </div>

    <div class="filter-fields">
        <!-- SUCURSAL -->
        <mat-form-field appearance="outline" class="filter-field branch-field">
            <mat-label>Sucursal</mat-label>

            <mat-icon matPrefix> storefront </mat-icon>

            <mat-select [(ngModel)]="filtro.branch_id" [disabled]="loading">
                <mat-option [value]="null"> Todas las sucursales </mat-option>

                <mat-option *ngFor="let sucursal of sucursales" [value]="sucursal.Id">
                    {{ sucursal.Nombre }}
                </mat-option>
            </mat-select>
        </mat-form-field>

        <!-- PRODUCTO -->
        <mat-form-field appearance="outline" class="filter-field product-field">
            <mat-label>Producto</mat-label>

            <mat-icon matPrefix> inventory_2 </mat-icon>

            <mat-select [(ngModel)]="filtro.product_id" [disabled]="loading">
                <mat-option [value]="null"> Todos los productos </mat-option>

                <mat-option *ngFor="let producto of productos" [value]="producto.Id">
                    {{ producto.Codigo ? producto.Codigo + " - " : "" }}
                    {{ producto.Nombre }}
                </mat-option>
            </mat-select>
        </mat-form-field>

        <!-- FECHA INICIAL -->
        <mat-form-field appearance="outline" class="filter-field date-field">
            <mat-label>Desde</mat-label>

            <input matInput readonly [matDatepicker]="dateStartPicker" [(ngModel)]="filtro.date_start"
                [disabled]="loading" />

            <mat-datepicker-toggle matSuffix [for]="dateStartPicker">
            </mat-datepicker-toggle>

            <mat-datepicker #dateStartPicker></mat-datepicker>
        </mat-form-field>

        <!-- FECHA FINAL -->
        <mat-form-field appearance="outline" class="filter-field date-field">
            <mat-label>Hasta</mat-label>

            <input matInput readonly [matDatepicker]="dateEndPicker" [(ngModel)]="filtro.date_end"
                [disabled]="loading" />

            <mat-datepicker-toggle matSuffix [for]="dateEndPicker">
            </mat-datepicker-toggle>

            <mat-datepicker #dateEndPicker></mat-datepicker>
        </mat-form-field>
    </div>

    <div class="filter-actions">
        <button mat-icon-button type="button" class="clear-button" matTooltip="Limpiar filtros" [disabled]="loading"
            (click)="limpiarFiltros()">
            <mat-icon>restart_alt</mat-icon>
        </button>

        <button mat-flat-button type="button" class="search-button" [disabled]="loading" (click)="aplicarFiltros()">
            <mat-icon>
                {{ loading ? "hourglass_top" : "search" }}
            </mat-icon>

            <span>
                {{ loading ? "Consultando" : "Consultar" }}
            </span>
        </button>
    </div>
</section>
