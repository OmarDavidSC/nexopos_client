<div class="container-fluid">
    <!-- LOADING -->
    <div class="dashboard-loading" *ngIf="Loading">
        <div class="loading-content">
            <mat-spinner diameter="42"></mat-spinner>

            <span> Cargando información del negocio... </span>
        </div>
    </div>

    <ng-container *ngIf="!Loading">
        <!-- BIENVENIDA -->
        <section class="welcome-section">
            <app-welcome-card [moneda]="CompaniaActual?.SimboloMoneda" [usuario]="UsuarioActual" [resumen]="Resumen">
            </app-welcome-card>
        </section>

        <!-- ACCESOS RÁPIDOS -->
        <section class="dashboard-section quick-access-section" *ngIf="tienePermiso(Role, ['administrator'])">
            <div class="section-header">
                <div class="section-header__left">
                    <div class="section-icon quick-icon">
                        <mat-icon>bolt</mat-icon>
                    </div>

                    <div>
                        <h2>Accesos rápidos</h2>

                        <p>Ingresa directamente a las funciones más utilizadas.</p>
                    </div>
                </div>

                <span class="section-badge">
                    {{ AccesosRapidos.length }} opciones
                </span>
            </div>

            <div class="quick-access-grid">
                <button mat-button type="button" class="quick-access-item" *ngFor="let item of AccesosRapidos"
                    [routerLink]="item.ruta">
                    <div class="quick-access-icon">
                        <mat-icon>
                            {{ item.icono }}
                        </mat-icon>
                    </div>

                    <div class="quick-access-info">
                        <strong>
                            {{ item.nombre }}
                        </strong>

                        <span> Abrir módulo </span>
                    </div>

                    <mat-icon class="quick-access-arrow"> arrow_forward </mat-icon>
                </button>
            </div>
        </section>

        <!-- INFORMACIÓN DESTACADA -->
        <section class="dashboard-section analytics-section" *ngIf="tienePermiso(Role, ['administrator'])">
            <div class="section-header">
                <div class="section-header__left">
                    <div class="section-icon analytics-icon">
                        <mat-icon>monitoring</mat-icon>
                    </div>

                    <div>
                        <h2>Actividad destacada</h2>

                        <p>Resumen de productos y categorías con mayor movimiento.</p>
                    </div>
                </div>

                <span class="section-badge"> Rendimiento </span>
            </div>

            <div class="analytics-grid">
                <div class="analytics-card">
                    <app-top-products [moneda]="CompaniaActual?.SimboloMoneda" [data]="ProductosDestacados">
                    </app-top-products>
                </div>

                <div class="analytics-card">
                    <app-top-categories [moneda]="CompaniaActual?.SimboloMoneda" [data]="CategoriasDestacadas">
                    </app-top-categories>
                </div>
            </div>
        </section>
    </ng-container>
</div>
