<h2 mat-dialog-title class="dialog-title">
    <div class="d-flex align-items-center gap-2">
        <mat-icon color="warn">lock_reset</mat-icon>
        <span>{{ TituloPopup }}</span>
    </div>
</h2>

<mat-dialog-content class="px-2 px-md-3 pb-2">
    <form [formGroup]="Form">
        <!-- HEADER -->
        <div class="password-header mb-4">
            <div class="icon-wrapper">
                <mat-icon>security</mat-icon>
            </div>
            <div class="text-center mt-3">
                <h5 class="fw-bold mb-1"> Seguridad de Cuenta </h5>
                <div class="text-muted small">
                    Actualiza tu contraseña para mantener protegida tu cuenta
                </div>
            </div>
        </div>

        <!-- FORM -->
        <div class="row g-3">
            <div class="col-12">
                <mat-form-field appearance="outline" class="w-100">
                    <mat-label>Nueva contraseña</mat-label>
                    <input matInput type="password" formControlName="new_password">
                    <mat-icon matSuffix>lock</mat-icon>
                </mat-form-field>
            </div>

            <div class="col-12">
                <mat-form-field appearance="outline" class="w-100">
                    <mat-label>Confirmar contraseña</mat-label>
                    <input matInput type="password" formControlName="repet_password">
                    <mat-icon matSuffix>verified_user</mat-icon>
                </mat-form-field>
            </div>
        </div>

        <!-- INFO -->
        <div class="info-box mt-3">
            <div class="d-flex align-items-start gap-2">
                <mat-icon color="primary"> info </mat-icon>
                <div>
                    <div class="fw-semibold small">
                        Recomendaciones de seguridad
                    </div>
                    <div class="text-muted small">
                        Usa una contraseña segura con letras, números y caracteres especiales.
                    </div>
                </div>
            </div>
        </div>
    </form>

</mat-dialog-content>
<mat-divider></mat-divider>
<mat-dialog-actions class="px-3 py-3">
    <div class="w-100 d-flex flex-column flex-md-row justify-content-end gap-2">
        <button mat-stroked-button mat-dialog-close>
            Cancelar
        </button>
        <button mat-raised-button color="primary" [disabled]="isLoading" (click)="eventoGuardar()">
            <mat-icon>save</mat-icon>
            {{ TituloButton }}
        </button>
    </div>
</mat-dialog-actions>
