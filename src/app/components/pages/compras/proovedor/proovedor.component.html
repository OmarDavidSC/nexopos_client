<!-- administracion-tipo-incidencias.component.html -->

<div class="contenedor-admin">
    <!-- HEADER -->
    <app-adm-header [titulo]="'Administración de Proovedores'"
        [descripcion]="'Gestión y mantenimiento de proovedores registrados'" [totalRegistros]="TotalRegistros"
        [textoBoton]="'Nuevo Proovedor'" [rutaRegreso]="'/inicio'" (accionNuevo)="eventoMostrarPopupRegistrar()"
        [visible]="true">
    </app-adm-header>
    <!-- TABLA -->
    <div class="table-container">
        <!-- LOADING -->
        <div *ngIf="Loading" class="loading-overlay">
            <div class="loading-box">
                <mat-spinner diameter="42"></mat-spinner>
                <span>
                    Cargando proovedores...
                </span>
            </div>
        </div>
        <!-- TABLA -->
        <div class="table-responsive">
            <table mat-table [dataSource]="ListaProveedores" class="tabla-admin">
                <ng-container matColumnDef="NumeroDocumento">
                    <th mat-header-cell *matHeaderCellDef> Numero Documento </th>
                    <td mat-cell *matCellDef="let element">
                        <div class="nombre-box">
                            <div>
                                <div class="nombre-principal">
                                    {{element.NumeroDocumento}}
                                </div>
                            </div>
                        </div>
                    </td>
                </ng-container>
                <ng-container matColumnDef="NombreEmpresa">
                    <th mat-header-cell *matHeaderCellDef> Nombre Empresa</th>
                    <td mat-cell *matCellDef="let element">
                        <div class="nombre-box">
                            <div>
                                <div class="nombre-principal">
                                    {{element.NombreEmpresa}}
                                </div>
                            </div>
                        </div>
                    </td>
                </ng-container>
                <ng-container matColumnDef="Contacto">
                    <th mat-header-cell *matHeaderCellDef> Contacto</th>
                    <td mat-cell *matCellDef="let element">
                        <div class="nombre-box">
                            <div>
                                <div class="nombre-principal">
                                    {{element.Contacto}}
                                </div>
                            </div>
                        </div>
                    </td>
                </ng-container>
                <ng-container matColumnDef="Telefono">
                    <th mat-header-cell *matHeaderCellDef> Telefono</th>
                    <td mat-cell *matCellDef="let element">
                        <div class="nombre-box">
                            <div>
                                <div class="nombre-principal">
                                    {{element.Telefono}}
                                </div>
                            </div>
                        </div>
                    </td>
                </ng-container>
                <ng-container matColumnDef="Correo">
                    <th mat-header-cell *matHeaderCellDef> Correo</th>
                    <td mat-cell *matCellDef="let element">
                        <div class="nombre-box">
                            <div>
                                <div class="nombre-principal">
                                    {{element.Correo}}
                                </div>
                            </div>
                        </div>
                    </td>
                </ng-container>
                <ng-container matColumnDef="Direccion">
                    <th mat-header-cell *matHeaderCellDef> Direccion</th>
                    <td mat-cell *matCellDef="let element">
                        <div class="nombre-box">
                            <div>
                                <div class="nombre-principal">
                                    {{element.Direccion}}
                                </div>
                            </div>
                        </div>
                    </td>
                </ng-container>
                <!-- ACCIONES -->
                <ng-container matColumnDef="Acciones">
                    <th mat-header-cell *matHeaderCellDef>
                        Acciones
                    </th>
                    <td mat-cell *matCellDef="let element">
                        <div class="acciones-box">
                            <button (click)="eventoMostrarPopupEditar(element)" mat-icon-button
                                class="btn-accion btn-editar" matTooltip="Editar">
                                <mat-icon>edit</mat-icon>
                            </button>
                            <button (click)="eventoEliminar(element)" mat-icon-button class="btn-accion btn-eliminar"
                                matTooltip="Eliminar">
                                <mat-icon>delete</mat-icon>
                            </button>
                        </div>
                    </td>
                </ng-container>
                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="fila-tabla">
                </tr>
            </table>
        </div>
        <!-- PAGINADOR -->
        <app-adm-paginator [PaginaActual]="PaginaActual" [TotalPaginas]="TotalPaginas"
            (cambiarPaginaEvent)="OnchangedPage($event)">
        </app-adm-paginator>
    </div>
</div>
