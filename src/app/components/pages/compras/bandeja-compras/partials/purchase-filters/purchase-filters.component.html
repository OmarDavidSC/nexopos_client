<div class="filters-card">
    <div class="row g-3 align-items-end">
        <!-- Buscar -->
        <div class="col-xl-6 col-lg-12">
            <mat-form-field appearance="outline" class="w-100">
                <mat-label>Buscar compra</mat-label>
                <mat-icon matPrefix>search</mat-icon>
                <input matInput placeholder="Proveedor, comprobante o serie..." [(ngModel)]="filter.search"
                    (keyup.enter)="search.emit()">
            </mat-form-field>
        </div>
        <!-- Proveedor -->
        <div class="col-xl-3 col-md-6">
            <mat-form-field appearance="outline" class="w-100">
                <mat-label>Proveedor</mat-label>
                <mat-select [(ngModel)]="filter.supplier_id" (selectionChange)="supplierChange.emit()">
                    <mat-option [value]="null">Todos</mat-option>
                    <mat-option *ngFor="let item of suppliers" [value]="item.Id">
                        {{item.NombreEmpresa}}
                    </mat-option>
                </mat-select>
            </mat-form-field>
        </div>
        <!-- Estado -->
        <div class="col-xl-2 col-md-4">
            <mat-form-field appearance="outline" class="w-100">
                <mat-label>Estado</mat-label>
                <mat-select [(ngModel)]="filter.status" (selectionChange)="statusChange.emit()">
                    <mat-option [value]="null">Todos</mat-option>
                    <mat-option value="PENDING">Pendiente</mat-option>
                    <mat-option value="COMPLETED">Completada</mat-option>
                    <mat-option value="CANCELLED">Cancelada</mat-option>
                </mat-select>
            </mat-form-field>
        </div>
        <!-- Limpiar -->
        <div class="col-xl-1 col-md-2 d-grid">
            <button mat-icon-button class="btn-clear" matTooltip="Limpiar filtros" (click)="clear.emit()">
                <mat-icon>restart_alt</mat-icon>
            </button>
        </div>
    </div>
</div>
