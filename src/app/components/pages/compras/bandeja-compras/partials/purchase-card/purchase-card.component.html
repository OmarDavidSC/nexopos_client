<div class="purchase-item mt-2">
    <div class="purchase-main">
        <div class="purchase-left">
            <span class="status-dot" [ngClass]="{
                    'completed': purchase.Estado == 'COMPLETED',
                    'pending': purchase.Estado == 'PENDING',
                    'cancelled': purchase.Estado == 'CANCELLED'
                }">
            </span>
            <div class="purchase-content">
                <div class="purchase-top">
                    <div class="document">
                        {{purchase.Documento}}
                    </div>
                    <div class="amount">
                        S/ {{purchase.Total | number:'1.2-2'}}
                    </div>
                </div>
                <div class="supplier">
                    {{purchase.NombreProveedor}}
                </div>
                <div class="meta">
                    <span>
                        {{purchase.ProductoTotales}} productos
                    </span>
                    <span>•</span>
                    <span>
                        {{purchase.NombreUsuarioRegistrador}}
                    </span>
                    <span>•</span>
                    <span>
                        {{purchase.FechaCompra}}
                    </span>
                </div>
            </div>
        </div>
        <div class="purchase-actions">
            <button mat-stroked-button color="primary" (click)="view.emit(purchase)">
                <mat-icon>visibility</mat-icon>
                Ver detalle
            </button>
            <button *ngIf="purchase.Estado=='COMPLETED'" mat-flat-button color="warn" (click)="cancel.emit(purchase)">
                <mat-icon>cancel</mat-icon>
                Cancelar
            </button>
        </div>
    </div>
</div>
